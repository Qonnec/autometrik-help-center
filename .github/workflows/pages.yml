name: Publish Help Center

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build article index
        run: node scripts/build-articles.mjs
      - uses: actions/configure-pages@v5
      - name: Prepare site files
        run: |
          mkdir -p _site/articles
          cp index.html articles.json _site/
          cp -R images _site/
          cp -R articles/images _site/articles/
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site
      - name: Publish site
        id: deployment
        uses: actions/deploy-pages@v4
