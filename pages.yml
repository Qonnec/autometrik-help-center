name: Publish Help Center

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build article index
        run: node scripts/build-articles.mjs
      - name: Check release notes
        run: |
          node -e "
            const notes = JSON.parse(require('fs').readFileSync('release-notes.json', 'utf8'));
            if (!Array.isArray(notes)) throw new Error('release-notes.json must be an array');
            notes.forEach((n, i) => {
              if (!/^\d{4}-\d{2}-\d{2}$/.test(n.date) || !n.type || !n.module || !n.change)
                throw new Error('release-notes.json item ' + i + ' needs date (YYYY-MM-DD), type, module and change');
            });
            console.log('release-notes.json OK, ' + notes.length + ' items');
          "
      - uses: actions/configure-pages@v5
      - name: Prepare site files
        run: |
          mkdir -p _site/articles
          cp index.html articles.json release-notes.json _site/
          cp -R images _site/
          cp -R articles/images _site/articles/
          cp -R forms _site/
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site
      - name: Publish site
        id: deployment
        uses: actions/deploy-pages@v4
